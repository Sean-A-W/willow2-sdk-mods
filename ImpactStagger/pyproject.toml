[project]
name = "ImpactStagger"
version = "0.0.0"
authors = [{ name = "sean" }]
description = "<font size='14' color='#e8131d'><B>Impact Stagger</B></font>\nOverhauls how ragdolls get triggered during gameplay. Enemies ragdoll when hit with powerful attacks, take impact damage from collisions, and get pulled by singularity gravity wells.\n\n<font color='#f5a623'><B>Features:</B></font>\n- Per-weapon force multipliers (bullets, rockets, grenades, melee, skills, vehicles, shields)\n- Singularity gravity wells pull and ragdoll nearby enemies\n- Ragdoll bowling — launched enemies knock down others on contact\n- Impact damage from high-velocity collisions\n- Configurable stagger filters (bosses, champions)\n- Momentum accumulation for multi-projectile weapons\n- Multiplayer support with host-synced settings"
dependencies = [
    "uemath >= 1.0",
]

[tool.sdkmod]
name = "Impact Stagger"
license = {name = "MIT", url = "https://choosealicense.com/licenses/mit/"}
version = "0.0.0"
supported_games = ["BL2"]
coop_support = "Unknown"
download = "https://github.com/sean-a-w/willow2-sdk-mods/releases/download/latest/ImpactStagger.sdkmod"
