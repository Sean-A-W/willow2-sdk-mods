[project]
name = "CollisionToolkit"
version = "0.2.0"
authors = [{ name = "NoneGiven" }, { name = "sean (modified)" }]
description = "Visualize, disable, and manipulate invisible collision geometry for map exploration and debugging."
dependencies = [
    "uemath >= 1.0",
]

[tool.sdkmod]
name = "Collision Toolkit"
version = "0.2.0"
supported_games = ["BL2", "TPS", "AoDK"]
coop_support = "ClientSide"
download = "https://github.com/sean-a-w/willow2-sdk-mods/releases/download/latest/CollisionToolkit.sdkmod"
